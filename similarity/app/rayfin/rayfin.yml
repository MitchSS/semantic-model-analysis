id: semantic-model-similarity
name: semantic-model-similarity
version: 1.0.0
services:
  functions:
    enabled: true
    path: packages/functions
    buildCommand: npm run build
    auth:
      type: application
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
connectors:
  - name: similaritylakehouse
    type: fabric-sqlanalytics
    config:
      workspaceId: a5a00e8c-d269-4422-9cfc-a6626a4f2ff3
      itemId: 845fae5b-bb66-41c3-9918-1e2ff3df0de3
    auth:
      type: application
    operations:
      - name: read
