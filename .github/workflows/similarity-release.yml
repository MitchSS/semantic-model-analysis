name: Prepare Similarity Release
run-name: Prepare similarity ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: MAJOR.MINOR.PATCH, for example 0.1.0 (no leading v)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease (keep checked for the initial 0.1.0 preview)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: similarity-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  validate:
    name: Validate and package the dispatched commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require a manual main dispatch and a valid version
        run: python -B .github/scripts/similarity_draft.py guard --version "$RELEASE_VERSION"
      - name: Install release validation tools
        run: python -m pip install --disable-pip-version-check -r .github/requirements-release.txt
      - name: Test release safeguards without GitHub writes
        run: python -B -m unittest discover -s .github/scripts -p 'test_similarity*.py' -v
      - name: Validate and build the similarity-only bundle
        run: >-
          python -B .github/scripts/similarity_release.py package
          --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
          --prerelease "$RELEASE_PRERELEASE" --output output/similarity-release
      - name: Retain the validated bundle for the draft job
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: similarity-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/similarity-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Create an unpublished draft for review
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the same source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Download only this run's validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - name: Verify the bundle, reserve its tag and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/scripts/similarity_draft.py create
          --version "$RELEASE_VERSION" --prerelease "$RELEASE_PRERELEASE"
          --bundle release-bundle